# Banco de Dados de Produção (obriga o uso de variáveis de ambiente no servidor)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carros?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useUnicode=yes&characterEncoding=UTF-8}
spring.datasource.username=${ERICK:erick}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# SEGURANÇA: 'validate' apenas valida o schema existente sem alterar o banco de dados
spring.jpa.hibernate.ddl-auto=validate

# PERFORMANCE & SEGURANÇA: Esconde os logs de SQL no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false